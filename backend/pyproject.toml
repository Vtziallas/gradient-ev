[project]
name = "gradient-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "scipy>=1.12"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.4", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
plugins = []

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true
